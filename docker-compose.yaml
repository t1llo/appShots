# appShots: App Store screenshot generator. One service carries the home page, the Studio, the REST API and
# the MCP endpoint (/mcp).
#
# Deploy the Compose file from this repository: set PUBLIC_URL, GOOGLE_CLIENT_ID,
# GOOGLE_CLIENT_SECRET and ADMIN_EMAIL, then give the `appshots` service a domain on port 3000.
# A reverse proxy terminates TLS; no host port is published.
#
# Local:   docker compose -f docker-compose.yaml -f compose.local.yaml up --build
x-service: &service
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  appshots:
    <<: *service
    build: .
    # Reaps the Chromium helper processes the renderer leaves behind.
    init: true
    environment:
      # The public origin, e.g. https://appshots.example.com. Used as the Google redirect, in the links
      # an agent gets back and in the skill at /skill.md. Empty falls back to each request's host.
      PUBLIC_URL: ${PUBLIC_URL:-}
      # Sign-in is Google only. OAuth client of type "Web application" with the redirect URI
      # <PUBLIC_URL>/auth/google/callback. Required here: without them the server has no sign-in at all.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set the client ID of your Google OAuth client}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?Set the client secret of your Google OAuth client}
      # Your own Google address: the admin. Sign-in is open to any Google account unless the admin narrows it under People.
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set your Google address, which becomes the admin}
      # Page analytics with PostHog, for the home page and the Studio. The project token is the public, write-only
      # one that ends up in the page anyway. POSTHOG_KEY=off turns analytics off.
      POSTHOG_KEY: ${POSTHOG_KEY:-}
      POSTHOG_HOST: ${POSTHOG_HOST:-https://us.i.posthog.com}
      # Who runs this server and where to write about one's data, as the privacy policy and the terms name them.
      OPERATOR_NAME: ${OPERATOR_NAME:-}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      # Caps for every account other than the admin.
      USER_MAX_PROJECTS: ${USER_MAX_PROJECTS:-20}
      USER_MAX_SHOTS: ${USER_MAX_SHOTS:-40}
      # Renders each of them gets. One export is one render.
      USER_RENDER_CREDITS: ${USER_RENDER_CREDITS:-10}
    expose: ["3000"]
    volumes:
      - appshots-data:/data
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://localhost:3000/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  appshots-data:
