# appShots: App Store screenshot generator. One service carries the home page, the Studio, the REST API and
# the MCP endpoint (/mcp).
#
# No host port is published: put a reverse proxy that terminates TLS in front of port 3000.
# Set PUBLIC_URL, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET and ADMIN_EMAIL in a .env file beside this one
# or in the environment, then route your domain to port 3000 of the `appshots` service.
#
# With the proxy on the host, or on your own machine, compose.local.yaml publishes the port on 127.0.0.1:
#   docker compose -f docker-compose.yaml -f compose.local.yaml up -d --build
x-service: &service
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  appshots:
    <<: *service
    build: .
    # Reaps the Chromium helper processes the renderer leaves behind.
    init: true
    environment:
      # The public origin, e.g. https://appshots.example.com. Used as the Google redirect, in the links
      # an agent gets back and in the skill at /skill.md. Empty falls back to each request's host.
      PUBLIC_URL: ${PUBLIC_URL:-}
      # Sign-in is Google only. OAuth client of type "Web application" with the redirect URI
      # <PUBLIC_URL>/auth/google/callback. Required here: without them the server has no sign-in at all.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set the client ID of your Google OAuth client}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?Set the client secret of your Google OAuth client}
      # Your own Google address: the admin. Sign-in is open to any Google account unless the admin narrows it on the Admin page.
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set your Google address, which becomes the admin}
      # Optional page analytics with Umami, for the home page, the docs and the Studio: the address of your Umami
      # server and the id this site has on it. Neither is a secret. Without both the pages load no analytics.
      UMAMI_URL: ${UMAMI_URL:-}
      UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
      # "on" also loads Umami's recorder, which replays visits, on the home page and the docs. Never in the Studio.
      UMAMI_RECORDER: ${UMAMI_RECORDER:-}
      # Who runs this server and where to write about one's data, as the privacy policy and the terms name them.
      OPERATOR_NAME: ${OPERATOR_NAME:-}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      # With a CDN or a second proxy in front of your reverse proxy: the request header it puts the visitor's address
      # in, e.g. CF-Connecting-IP. Leave it empty unless every request comes through that service.
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-}
      # Caps for every account other than the admin.
      USER_MAX_PROJECTS: ${USER_MAX_PROJECTS:-20}
      USER_MAX_SHOTS: ${USER_MAX_SHOTS:-40}
      # Renders each of them gets. One export is one render.
      USER_RENDER_CREDITS: ${USER_RENDER_CREDITS:-10}
    expose: ["3000"]
    volumes:
      - appshots-data:/data
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://localhost:3000/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  appshots-data:
