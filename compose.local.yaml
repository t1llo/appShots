# Publishes the port on this machine's own address (127.0.0.1) and nowhere else: for a run on your
# own machine, and for a server whose reverse proxy runs on the host.
#   docker compose -f docker-compose.yaml -f compose.local.yaml up --build
services:
  appshots:
    ports:
      - "127.0.0.1:${APPSHOTS_PORT:-3000}:3000"
