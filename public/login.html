<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Sign in · Shots</title>
    <!-- Inline styles: everything else under / needs a session, so this page cannot load app.css. -->
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f4f4f6;
        --panel: #fff;
        --line: #dcdce2;
        --text: #17171a;
        --muted: #6b6b76;
        --accent: #5b4bff;
        --danger: #c62828;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0c0c0e;
          --panel: #17171a;
          --line: #2a2a31;
          --text: #ededf0;
          --muted: #8d8d98;
          --accent: #7b6dff;
          --danger: #ff7b72;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      form {
        width: min(360px, 100%);
        padding: 28px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 20px;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0 0 20px;
        color: var(--muted);
      }
      label {
        display: block;
        margin-bottom: 6px;
        font-size: 13px;
        font-weight: 600;
      }
      input,
      button {
        width: 100%;
        height: 42px;
        border-radius: 10px;
        font: inherit;
      }
      input {
        padding: 0 12px;
        border: 1px solid var(--line);
        background: transparent;
        color: inherit;
      }
      input:focus-visible,
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      button {
        margin-top: 14px;
        border: 0;
        background: var(--accent);
        color: #fff;
        font-weight: 600;
        cursor: pointer;
      }
      .error {
        margin: 12px 0 0;
        color: var(--danger);
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <form method="post" action="/login">
      <h1>Shots</h1>
      <p>Enter the access token this server was deployed with.</p>
      <label for="token">Access token</label>
      <input id="token" name="token" type="password" autocomplete="current-password" required autofocus />
      <button type="submit">Sign in</button>
      <p class="error" id="error" role="alert" hidden>That token is not correct.</p>
    </form>
    <script>
      if (new URLSearchParams(location.search).has("error")) document.getElementById("error").hidden = false;
    </script>
  </body>
</html>
