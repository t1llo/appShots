<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Shots</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235b4bff'/%3E%3Crect x='10' y='6' width='12' height='20' rx='3.5' fill='none' stroke='%23fff' stroke-width='2.4'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <header class="bar">
      <a class="brand" href="#/" aria-label="Shots">
        <svg viewBox="0 0 32 32" width="24" height="24" aria-hidden="true">
          <rect width="32" height="32" rx="8" fill="var(--accent)" />
          <rect x="10" y="6" width="12" height="20" rx="3.5" fill="none" stroke="#fff" stroke-width="2.4" />
        </svg>
        <span>Shots</span>
      </a>
      <select id="project-select" aria-label="Project"></select>
      <button id="new-project" class="btn" type="button">New project</button>
      <span class="spacer"></span>
      <span id="status" class="status" role="status"></span>
      <select id="target-select" aria-label="Preview size" title="Preview size"></select>
      <select id="locale-select" aria-label="Preview language" title="Preview language"></select>
      <button id="connect" class="btn" type="button">Connect</button>
      <button id="export" class="btn primary" type="button">Export ZIP</button>
      <form method="post" action="/logout" id="logout" hidden>
        <button class="btn quiet" type="submit">Sign out</button>
      </form>
    </header>

    <main>
      <div id="workspace" class="workspace">
        <section id="empty" class="empty" hidden></section>

        <section id="shots-section" hidden>
          <div class="section-head">
            <h2>Screenshots</h2>
            <span class="hint" id="shots-hint"></span>
            <span class="spacer"></span>
            <label class="btn small">
              Upload
              <input type="file" id="file-input" multiple accept="image/png,image/jpeg,image/webp" hidden />
            </label>
          </div>
          <div id="shots" class="shots"></div>
        </section>

        <section id="slides-section" hidden>
          <div class="section-head">
            <h2>Slides</h2>
            <span class="hint">Live previews at the exact export size. Up to 10 per set.</span>
          </div>
          <div id="slides" class="slides"></div>
        </section>
      </div>
      <aside id="panel" class="panel" hidden></aside>
    </main>

    <dialog id="dialog"></dialog>
    <div id="toasts" class="toasts" aria-live="polite"></div>
    <div id="drop-veil" class="drop-veil" hidden>Drop screenshots to upload</div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
