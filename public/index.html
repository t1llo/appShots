<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>appShots</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2337352f'/%3E%3Crect x='10.5' y='6.5' width='11' height='19' rx='3' fill='none' stroke='%23fff' stroke-width='2.2'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body class="app">
    <nav class="sidebar" aria-label="Projects and settings">
      <div class="who">
        <span class="avatar" id="avatar" aria-hidden="true">A</span>
        <span class="who-text">
          <span class="who-name" id="who-name">appShots</span>
          <span class="who-sub" id="who-sub"></span>
        </span>
      </div>

      <div class="nav-group grow">
        <div class="nav-label">Projects</div>
        <div id="project-list"></div>
        <button class="nav-item quiet" id="new-project" type="button">
          <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.5v9M3.5 8h9" /></svg>
          <span class="nav-text">New project</span>
        </button>
      </div>

      <div class="nav-group">
        <button class="nav-item" id="connect" type="button">
          <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M9 1.8 3.8 9H8l-1 5.2L12.2 7H8z" /></svg>
          <span class="nav-text">Connect Claude and the CLI</span>
        </button>
        <button class="nav-item" id="people" type="button" hidden>
          <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
            <circle cx="6" cy="5.5" r="2.3" />
            <path d="M1.8 13c.5-2.1 2.1-3.2 4.2-3.2s3.700 1.100 4.200 3.200M10.600 3.500a2.200 2.200 0 0 1 0 4.200M12 9.900c1.200.400 2 1.400 2.300 3.100" />
          </svg>
          <span class="nav-text">People</span>
        </button>
        <button class="nav-item" id="account" type="button" hidden>
          <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
            <circle cx="8" cy="5.5" r="2.5" />
            <path d="M3 13.500c.600-2.400 2.600-3.500 5-3.500s4.400 1.100 5 3.500" />
          </svg>
          <span class="nav-text">Account</span>
        </button>
        <form method="post" action="/logout" id="logout" hidden>
          <button class="nav-item" type="submit">
            <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M6.500 2.500h-3v11h3M10 5l3 3-3 3M13 8H6.500" /></svg>
            <span class="nav-text">Sign out</span>
          </button>
        </form>
      </div>
    </nav>

    <div class="main">
      <header class="bar">
        <span class="crumb" id="crumb"></span>
        <span class="spacer"></span>
        <span id="status" class="status" role="status"></span>
        <select id="target-select" class="ghost" aria-label="Preview size" title="Preview size" hidden></select>
        <select id="locale-select" class="ghost" aria-label="Preview language" title="Preview language" hidden></select>
        <button id="export" class="btn primary" type="button" hidden>Export ZIP</button>
      </header>

      <div class="content">
        <div id="workspace" class="workspace">
          <section id="empty" class="empty" hidden></section>

          <div id="page-head" class="page-head" hidden>
            <input id="title" class="title" type="text" maxlength="80" placeholder="Untitled" aria-label="Project name" spellcheck="false" />
            <div id="page-meta" class="page-meta"></div>
          </div>

          <section id="shots-section" hidden>
            <div class="section-head">
              <h2>Screenshots</h2>
              <span class="hint" id="shots-hint"></span>
              <span class="spacer"></span>
              <label class="btn small">
                Upload
                <input type="file" id="file-input" multiple accept="image/png,image/jpeg,image/webp" hidden />
              </label>
            </div>
            <div id="shots" class="shots"></div>
          </section>

          <section id="slides-section" hidden>
            <div class="section-head">
              <h2>Slides</h2>
              <span class="hint">Live previews at the exact export size. Up to 10 per set.</span>
            </div>
            <div id="slides" class="slides"></div>
          </section>
        </div>
        <aside id="panel" class="panel" hidden></aside>
      </div>
    </div>

    <dialog id="dialog"></dialog>
    <div id="toasts" class="toasts" aria-live="polite"></div>
    <div id="drop-veil" class="drop-veil" hidden>Drop screenshots to upload</div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
